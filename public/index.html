<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加密货币交易所价格监控系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .status {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff4444;
            animation: pulse 2s infinite;
        }

        .status-dot.connected {
            background: #00ff88;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .update-time {
            font-size: 0.9em;
            color: #ccc;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-box {
            padding: 10px 20px;
            border-radius: 25px;
            border: none;
            font-size: 16px;
            width: 300px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }

        .sort-select {
            padding: 10px 20px;
            border-radius: 25px;
            border: none;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            cursor: pointer;
        }

        .table-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        thead {
            background: rgba(255, 255, 255, 0.2);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th {
            padding: 15px 10px;
            text-align: center;
            font-weight: bold;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
            white-space: nowrap;
        }

        th.symbol-col {
            width: 80px;
        }

        th.exchange-col {
            min-width: 180px;
        }

        tbody tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            transition: background 0.3s;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        td {
            padding: 12px 10px;
            text-align: center;
        }

        .symbol {
            font-weight: bold;
            font-size: 1.1em;
            color: #F0B90B;
        }

        .price-cell {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
        }

        .price-value {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 1em;
        }

        .price-diff {
            font-size: 0.85em;
            font-family: 'Courier New', monospace;
        }

        .binance-price {
            color: #F0B90B;
            font-weight: bold;
        }

        .positive {
            color: #ff4444;
        }

        .negative {
            color: #00ff88;
        }

        .neutral {
            color: #fff;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.5em;
        }

        .no-data {
            color: #999;
            font-style: italic;
            font-size: 0.9em;
        }

        .exchange-header {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .exchange-name {
            font-weight: bold;
        }

        @media (max-width: 1400px) {
            .container {
                padding: 0 10px;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 8px 5px;
            }

            .price-diff {
                font-size: 0.75em;
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .search-box {
                width: 100%;
            }

            table {
                font-size: 11px;
            }

            th, td {
                padding: 6px 3px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 加密货币交易所价格监控系统</h1>
            <div class="status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">连接中...</span>
            </div>
            <div class="update-time" id="updateTime">等待数据...</div>
        </header>

        <div class="controls">
            <input type="text" class="search-box" id="searchBox" placeholder="搜索币种 (例如: BTC, ETH)">
            <select class="sort-select" id="sortSelect">
                <option value="symbol">按币种排序</option>
                <option value="binancePrice">按币安价格排序</option>
                <option value="maxDiff">按最大价差排序</option>
            </select>
        </div>

        <div class="table-container">
            <table id="priceTable">
                <thead>
                    <tr>
                        <th class="symbol-col">币种</th>
                        <th class="exchange-col">
                            <div class="exchange-header">
                                <span class="exchange-name">币安</span>
                                <span style="font-size: 0.8em; opacity: 0.8;">(基准)</span>
                            </div>
                        </th>
                        <th class="exchange-col">
                            <div class="exchange-header">
                                <span class="exchange-name">OKX</span>
                                <span style="font-size: 0.8em; opacity: 0.8;">差异</span>
                            </div>
                        </th>
                        <th class="exchange-col">
                            <div class="exchange-header">
                                <span class="exchange-name">火币</span>
                                <span style="font-size: 0.8em; opacity: 0.8;">差异</span>
                            </div>
                        </th>
                        <th class="exchange-col">
                            <div class="exchange-header">
                                <span class="exchange-name">Gate.io</span>
                                <span style="font-size: 0.8em; opacity: 0.8;">差异</span>
                            </div>
                        </th>
                        <th class="exchange-col">
                            <div class="exchange-header">
                                <span class="exchange-name">KuCoin</span>
                                <span style="font-size: 0.8em; opacity: 0.8;">差异</span>
                            </div>
                        </th>
                    </tr>
                </thead>
                <tbody id="priceTableBody">
                    <tr>
                        <td colspan="6" class="loading">正在加载数据...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let priceData = {};
        let ws;
        let sortBy = 'symbol';
        let searchTerm = '';

        // 连接WebSocket
        function connectWebSocket() {
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${wsProtocol}//${window.location.host}`);

            ws.onopen = () => {
                document.getElementById('statusDot').classList.add('connected');
                document.getElementById('statusText').textContent = '已连接';
                console.log('WebSocket已连接');
            };

            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                if (message.type === 'priceUpdate') {
                    priceData = message.data;
                    renderPrices();
                    updateTimestamp(message.timestamp);
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket错误:', error);
                document.getElementById('statusDot').classList.remove('connected');
                document.getElementById('statusText').textContent = '连接错误';
            };

            ws.onclose = () => {
                document.getElementById('statusDot').classList.remove('connected');
                document.getElementById('statusText').textContent = '连接断开，正在重连...';
                setTimeout(connectWebSocket, 3000);
            };
        }

        // 更新时间戳
        function updateTimestamp(timestamp) {
            const date = new Date(timestamp);
            const timeStr = date.toLocaleTimeString('zh-CN', { hour12: false });
            document.getElementById('updateTime').textContent = `最后更新: ${timeStr}`;
        }

        // 格式化价格
        function formatPrice(price) {
            if (price >= 1000) {
                return price.toFixed(2);
            } else if (price >= 1) {
                return price.toFixed(4);
            } else {
                return price.toFixed(6);
            }
        }

        // 格式化价格差异
        function formatDiff(diff, percent) {
            const sign = diff >= 0 ? '+' : '';
            return {
                amount: `${sign}${diff.toFixed(4)}`,
                percent: `${sign}${percent.toFixed(2)}%`
            };
        }

        // 渲染价格表格
        function renderPrices() {
            const tbody = document.getElementById('priceTableBody');

            // 转换为数组并过滤
            let dataArray = Object.values(priceData);

            // 搜索过滤
            if (searchTerm) {
                dataArray = dataArray.filter(item =>
                    item.symbol.toLowerCase().includes(searchTerm.toLowerCase())
                );
            }

            // 排序
            dataArray.sort((a, b) => {
                switch (sortBy) {
                    case 'binancePrice':
                        return b.binancePrice - a.binancePrice;
                    case 'maxDiff':
                        const aMaxDiff = getMaxDiff(a);
                        const bMaxDiff = getMaxDiff(b);
                        return Math.abs(bMaxDiff) - Math.abs(aMaxDiff);
                    default:
                        return a.symbol.localeCompare(b.symbol);
                }
            });

            if (dataArray.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="loading">没有找到匹配的币种</td></tr>';
                return;
            }

            tbody.innerHTML = dataArray.map(data => {
                // 币安价格列
                const binanceCell = `
                    <td>
                        <div class="price-cell">
                            <span class="price-value binance-price">$${formatPrice(data.binancePrice)}</span>
                        </div>
                    </td>
                `;

                // 其他交易所列
                const exchanges = ['okx', 'huobi', 'gate', 'kucoin'];
                const exchangeCells = exchanges.map(exchangeId => {
                    const exchange = data.exchanges[exchangeId];
                    if (!exchange) {
                        return `
                            <td>
                                <div class="price-cell">
                                    <span class="no-data">--</span>
                                </div>
                            </td>
                        `;
                    }

                    const diffFormatted = formatDiff(exchange.diff, exchange.diffPercent);
                    const diffClass = exchange.diff > 0 ? 'positive' : (exchange.diff < 0 ? 'negative' : 'neutral');

                    return `
                        <td>
                            <div class="price-cell">
                                <span class="price-value">$${formatPrice(exchange.price)}</span>
                                <span class="price-diff ${diffClass}">${diffFormatted.percent}</span>
                            </div>
                        </td>
                    `;
                }).join('');

                return `
                    <tr>
                        <td><span class="symbol">${data.symbol}</span></td>
                        ${binanceCell}
                        ${exchangeCells}
                    </tr>
                `;
            }).join('');
        }

        // 获取最大价差
        function getMaxDiff(data) {
            if (!data.exchanges || Object.keys(data.exchanges).length === 0) return 0;
            const diffs = Object.values(data.exchanges).map(e => e.diffPercent);
            return Math.max(...diffs.map(Math.abs));
        }

        // 事件监听
        document.getElementById('searchBox').addEventListener('input', (e) => {
            searchTerm = e.target.value;
            renderPrices();
        });

        document.getElementById('sortSelect').addEventListener('change', (e) => {
            sortBy = e.target.value;
            renderPrices();
        });

        // 启动
        connectWebSocket();
    </script>
</body>
</html>
